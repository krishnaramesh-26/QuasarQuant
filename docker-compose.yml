services:
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_PA SSWORD: $POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

      

volumes:
  postgres_data:
